apiVersion: apps/v1
kind: Deployment
metadata:
  name: sri-demo-be
  namespace: default
  labels:
    app: sri-demo-be
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sri-demo-be
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sri-demo-be
        version: v1
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: sri-demo-be
        image: ghcr.io/sugirepo/sri_demo_be:be-latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        env:
        # NumPy CPU compatibility flags - untuk handle X86_V2 issues
        - name: OPENBLAS_CORETYPE
          value: "NEHALEM"
        - name: MKL_DEBUG_CPU_TYPE
          value: "5"
        - name: NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: APP_ENV
          value: "development"
        - name: APP_ENV
          value: "development"
        # API Authentication
        - name: API_AUTH_ENABLED
          value: "true"
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: sri-demo-secrets
              key: api-keys
        # Database connection
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sri-demo-secrets
              key: database-url
        # Elasticsearch configuration
        - name: ELASTICSEARCH_URL
          valueFrom:
            secretKeyRef:
              name: sri-demo-secrets
              key: elasticsearch-url
        - name: ELASTICSEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: sri-demo-secrets
              key: elasticsearch-api-key
        - name: ELASTICSEARCH_INDEX
          value: "documents"
        - name: ELASTICSEARCH_SEMANTIC_INDEX
          value: "documents-semantic"
        - name: SEMANTIC_INFERENCE_ID
          value: ".jina-embeddings-v5-text-small"
        # Tika configuration
        - name: TIKA_ENDPOINT
          value: "http://tika.tika-demo.svc.cluster.local:9998/tika"
        - name: TIKA_PDF_OCR_ENABLED
          value: "true"
        - name: TIKA_OCR_LANGUAGE
          value: "eng+ind"
        - name: TIKA_OCR_MAX_FILE_SIZE
          value: "52428800"
        - name: TIKA_REQUEST_TIMEOUT
          value: "300"
        # Document processing
        - name: MIN_PDF_TEXT_CHARS
          value: "50"
        - name: DOCUMENT_STORAGE_ROOT
          value: "storage/documents"
        # CORS
        - name: CORS_ALLOW_ORIGINS
          value: "*"
        # Logging
        - name: LOG_DIR
          value: "logs"
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_ROTATION
          value: "daily"
        - name: LOG_BACKUP_COUNT
          value: "30"
        - name: LOG_MAX_BYTES
          value: "10485760"
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: logs
          mountPath: /app/logs
      
      volumes:
      - name: storage
        emptyDir: {}
      - name: logs
        emptyDir: {}
      
      # Pod Disruption Budget untuk high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - sri-demo-be
              topologyKey: kubernetes.io/hostname
