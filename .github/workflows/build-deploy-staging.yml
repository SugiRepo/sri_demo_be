name: Build and Deploy to GHCR (Staging)

on:
  push:
    branches:
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/sugiRepo/sri_demo_be

jobs:
  build:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          GIT_SHA=${{ github.sha }}
          SHORT_SHA=${GIT_SHA:0:7}
          IMAGE_TAG="${{ github.ref_name }}-${SHORT_SHA}-${TIMESTAMP}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:be-latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Output image details
        run: |
          echo "Image pushed: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}"
          echo "Latest tag: ${{ env.IMAGE_NAME }}:be-latest"

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl context
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update deployment image and trigger rolling restart
        run: |
          kubectl set image deployment/sri-demo-be-deployment \
            sri-demo-be=ghcr.io/sugiRepo/sri_demo_be:be-latest \
            -n default
          
          # Trigger rolling restart by updating annotation (no downtime)
          kubectl patch deployment sri-demo-be-deployment \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"deployment.kubernetes.io/restart\":\"$(date +%s)\"}}}}}" \
            -n default

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/sri-demo-be-deployment \
            -n default \
            --timeout=5m
